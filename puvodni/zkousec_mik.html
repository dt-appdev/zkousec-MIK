# Okruh A

@ A = Stavební zákon (zák. 283/2021) – pojmy, role, povolování, kolaudace

? [A1] Záměrem se rozumí
+ stavba, soubor staveb, zařízení, údržba dokončené stavby, změna využití území, dělení nebo scelování pozemků a stanovení ochranného pásma
> § 4 odst. 1 stavebního zákona
- stavba, soubor staveb, zařízení a udržovací práce na dokončené stavbě
- stavba, soubor staveb, zařízení, změna využití území a stanovení ochranného pásma, s výjimkou dělení a scelování pozemků
- stavba, soubor staveb a stanovení ochranného pásma
- stavba, zařízení, změna využití území, dělení nebo scelování pozemků a vydání územního rozhodnutí
- stavba, soubor staveb, zařízení, údržba dokončené stavby a dělení nebo scelování pozemků, avšak bez stanovení ochranného pásma

? [A2] Stavbou se rozumí
+ stavební dílo, které vzniká stavební nebo montážní činností ze stavebních výrobků, materiálů nebo konstrukcí za účelem užívání na určitém místě
> § 5 odst. 1 stavebního zákona
- stavební dílo, které vzniká stavební nebo montážní činností a je zapsáno v katastru nemovitostí
- výrobek plnící funkci stavby bez ohledu na způsob jeho zhotovení
- stavební dílo vzniklé jakoukoli lidskou činností na určitém místě bez ohledu na použité materiály
- dílo vzniklé stavební činností ze stavebních výrobků určené k trvalému užívání

? [A3] Považuje se za stavbu také výrobek plnící funkci stavby?
+ Ano
> § 5 odst. 1 věta poslední stavebního zákona
- Ne
- Ano, ale pouze pokud je pevně spojen se zemí
- Pouze pokud tak stanoví prováděcí vyhláška
- Ano, ale jen u dočasných staveb

? [A4] Musí být stavba pevně spojena se zemí?
+ Ne
> § 5 odst. 1 stavebního zákona
- Ano
- Ano, s výjimkou staveb zařízení staveniště
- Pouze u staveb pro bydlení
- Záleží na rozhodnutí stavebního úřadu v konkrétním případě

? [A5] Stavební zákon dělí stavby na
+ drobné, jednoduché, vyhrazené a ostatní
> § 5 odst. 2 stavebního zákona a přílohy č. 1, 2 a 3 ke stavebnímu zákonu
- jednoduché, drobné a vyhrazené
- drobné, jednoduché, ostatní a dočasné
- vyhrazené, ostatní a stavby pro bydlení
- drobné, běžné, vyhrazené a ostatní

? [A6] Dočasnou stavbou se rozumí
+ stavba, u které stavební úřad předem omezí dobu jejího trvání
> § 5 odst. 5 stavebního zákona
- stavba, která je od počátku určena k odstranění do 1 roku od dokončení
- stavba, jejíž dočasnost vyplývá přímo ze stavebního zákona bez rozhodnutí úřadu
- stavba zařízení staveniště bez ohledu na rozhodnutí stavebního úřadu
- stavba, u které stavebník sám určí dobu jejího trvání v žádosti

? [A7] Používá-li stavební zákon pojem stavba, rozumí tím podle okolností také její část nebo změna dokončené stavby?
+ Ano
> § 5 odst. 6 stavebního zákona
- Ne
- Ano, ale pouze pro účely řízení o odstranění stavby
- Pouze pokud jde o změnu dokončené stavby, nikoli o její část
- Ano, avšak pouze pro vyhrazené stavby

? [A8] Souborem staveb se rozumí
+ vzájemně související stavby, jimiž se v rámci jednoho záměru uskutečňuje výstavba na souvislém území nebo za společným účelem
> § 5 odst. 3 stavebního zákona
- vzájemně nesouvisející stavby umístěné na sousedních pozemcích, jejichž výstavba probíhá nezávisle na sobě v různém čase
- stavby stejného stavebníka bez ohledu na jejich vzájemnou souvislost, které jsou umístěny v rámci jednoho katastrálního území
- vzájemně související stavby, které mají společného zhotovitele a jsou prováděny na základě jednoho stavebního povolení
- soubor staveb hlavních bez vedlejších staveb, uskutečňovaný v rámci jednoho záměru na souvislém území

? [A9] Stavbou hlavní v rámci souboru staveb se rozumí
+ stavba, která určuje účel výstavby souboru staveb.
> § 5 odst. 4 stavebního zákona
- stavba s největší zastavěnou plochou v rámci souboru staveb
- stavba, kterou stavebník označí jako hlavní v žádosti o povolení
- stavba, která je z hlediska stavebního zákona vyhrazenou stavbou
- stavba, jejíž provedení je časově první v rámci souboru staveb

? [A10] Musí soubor staveb vždy obsahovat stavbu hlavní?
+ Ano
> § 5 odst. 4 stavebního zákona
- Ne
- Ano, ale pouze u souborů staveb pro bydlení
- Ne, pouze pokud tak stanoví prováděcí předpis
- Ano, s výjimkou souborů staveb technické infrastruktury

? [A11] Rozumí se změnou dokončené stavby pouze nástavba, přístavba a stavební úprava?
+ Ne, změnou dokončené stavby se rozumí také změna v užívání stavby
> § 6 odst. 2 písm. e) stavebního zákona
- Ano
- Ne, změnou dokončené stavby se rozumí pouze nástavba a přístavba
- Ano, ale jen pokud jde zároveň o stavební úpravu
- Ne, změna v užívání stavby se za změnu dokončené stavby nepovažuje nikdy

? [A12] Může stavební úpravou dojít ke změně výšky stavby?
+ Ne, v případě změny výšky stavby se jedná o nástavbu.
> § 6 odst. 1 písm. c) stavebního zákona
- Ano, pokud se nemění půdorysný rozsah stavby
- Ano, stavební úprava zahrnuje i změnu výšky stavby
- Ne, o nástavbu jde jen při změně půdorysného rozsahu stavby
- Ano, ale pouze u staveb pro bydlení

? [A13] Rozumí se staveništěm také místo, na kterém se stavba odstraňuje?
+ Ano
> § 9 odst. 1 stavebního zákona
- Ne
- Ano, ale pouze pokud je odstraňování prováděno svépomocí
- Ne, staveništěm se rozumí výhradně místo provádění nové stavby
- Ano, avšak jen u vyhrazených staveb

? [A14] Stavebním pozemkem se rozumí
+ pozemek, jeho část nebo soubor pozemků vymezený a určený k zastavění
> § 12 písm. b) stavebního zákona
- pozemek určený územním plánem k zastavění bez ohledu na jeho velikost
- pozemek, na kterém je již stavba umístěna a zkolaudována
- soubor pozemků evidovaných v katastru nemovitostí jako stavební parcela
- pozemek, jeho část nebo soubor pozemků, který je oplocen a přístupný z veřejné komunikace

? [A15] Uliční čarou se rozumí
+ hranice mezi pozemky a veřejným prostranstvím
> § 12 písm. m) stavebního zákona
- hranice mezi stavebním pozemkem a sousedním pozemkem
- hranice mezi pozemky určenými k zastavění a pozemky zemědělského půdního fondu
- rozhraní mezi stavbou a nezastavěnou částí pozemku
- hranice mezi veřejným prostranstvím a stavební čárou

? [A16] Stavební čarou se rozumí
+ rozhraní mezi stavbou a nezastavěnou částí pozemku, která určuje polohu hrany stavby ve výši rostlého nebo upraveného terénu
> § 12 písm. n) stavebního zákona
- hranice mezi pozemky a veřejným prostranstvím
- rozhraní mezi stavebním pozemkem a uliční čárou bez ohledu na výšku terénu
- hranice určující nejvzdálenější přípustnou polohu stavby od hranice pozemku
- rozhraní mezi stavbou a veřejným prostranstvím ve výši upraveného terénu sousedního pozemku

? [A17] Stavební prolukou se rozumí
+ nezastavěný prostor ve stávající souvislé zástavbě, včetně nezastavěného nároží, který je určen k zastavění
> § 12 písm. o) stavebního zákona
- zastavěný prostor ve stávající zástavbě určený k asanaci
- nezastavěný prostor mimo souvislou zástavbu určený k zastavění
- nezastavěné nároží, které není určeno k zastavění
- prostor mezi dvěma budovami, který nelze zastavět z důvodu požárních odstupů

? [A18] Může být budova stavebně otevřená (např. přístřešek)?
+ ne, budova musí být navenek převážně uzavřená obvodovými stěnami a střešní konstrukcí.
> § 13 písm. a) stavebního zákona
- ano, pokud je nosná konstrukce z lehkého materiálu
- ano, budova může být otevřená, pokud plní jen doplňkovou funkci
- ne, budova musí být uzavřena pouze střešní konstrukcí, stěny nejsou rozhodující
- ano, pokud jde o dočasnou stavbu

? [A19] Je rodinným domem stavba pro bydlení, která obsahuje i třetí nadzemní podlaží?
+ Ano, pokud je třetí nadzemní podlaží ustoupené od vnějšího líce obvodové stěny budovy orientované k uliční čáře alespoň o 2 metry
> § 13 písm. c) stavebního zákona
- Ne, rodinný dům nesmí mít třetí nadzemní podlaží za žádných okolností, i kdyby bylo jakkoli ustoupené
- Ano, pokud je třetí nadzemní podlaží ustoupené od uliční čáry alespoň o 3 metry od vnějšího líce obvodové stěny
- Ano, bez ohledu na ustoupení od obvodové stěny orientované k uliční čáře, postačí jakékoli podlaží navíc
- Ano, pokud je ustoupeno od vnějšího líce obvodové stěny budovy orientované k uliční čáře alespoň o 1 metr

? [A20] Jaký je maximální počet samostatných bytů v rodinném domě?
+ tři
> § 13 písm. c) stavebního zákona
- dva
- čtyři
- pět
- jeden

? [A21] Přístupností se rozumí
+ vytváření podmínek pro samostatné a bezpečné využití pozemků a staveb osobami s omezenou schopností pohybu nebo orientace s cílem bezbariérového užívání
> § 13 písm. d) stavebního zákona
- vytváření podmínek pro umístění staveb v blízkosti veřejné dopravní infrastruktury tak, aby byl zajištěn snadný příjezd vozidel
- zajištění bezbariérových úprav pouze u staveb občanského vybavení určených k užívání veřejností bez rozdílu
- povinnost stavebníka zřídit bezbariérový přístup ke všem stavbám bez výjimky bez ohledu na jejich účel a rozsah
- vytváření podmínek pro využívání staveb výhradně osobami se zdravotním postižením s cílem jejich bezbariérového užívání

? [A22] Jaká je nejmenší možná podlahová plocha obytné místnosti v případě, že byt tvoří více než jedna obytná místnost?
+ 8 m2
> § 13 písm. i) a l) stavebního zákona
- 12 m2
- 10 m2
- 9 m2
- 6 m2

? [A23] Jaká je nejmenší možná podlahová plocha obytné místnosti v případě, že byt tvoří pouze jedna obytná místnost?
+ 16 m2
> § 13 písm. i) a l) stavebního zákona
- 12 m2
- 18 m2
- 20 m2
- 14 m2

? [A24] Patří mezi osoby s omezenou schopností pohybu a orientace také osoba doprovázející dítě v kočárku nebo dítě do 3 let?
+ Ano
> § 13 písm. d) stavebního zákona
- Ne
- Ano, ale pouze osoba doprovázející dítě do 3 let, nikoli s kočárkem
- Ano, ale jen pokud jde o dítě starší 3 let
- Ne, pojem se vztahuje výhradně na osoby se zdravotním postižením

? [A25] Započítávají se plochy lodžií a arkýřů do zastavěné plochy stavby?
+ Ano
> § 13 písm. o) stavebního zákona
- Ne
- Ano, ale pouze plochy lodžií, arkýře se nezapočítávají
- Ne, započítávají se pouze plochy teras a balkonů
- Ano, ale jen u staveb pro bydlení

? [A26] Rozumí se stavebníkem též osoba, která pro sebe žádá vydání povolení odstranění stavby nebo stavbu odstraňuje?
+ Ano
> § 14 písm. a) stavebního zákona
- Ne
- Ano, ale pouze pokud je zároveň vlastníkem pozemku
- Ne, stavebníkem je vždy jen osoba, která stavbu odstraňuje svépomocí
- Ano, ale výhradně u vyhrazených staveb

? [A27] Zhotovitelem se rozumí
+ stavební podnikatel a v případě svépomocné formy výstavby se zhotovitelem rozumí stavebník
> § 14 písm. e) stavebního zákona
- stavební podnikatel, a to i v případě svépomocné formy výstavby
- osoba s oprávněním podle autorizačního zákona provádějící stavbu
- stavební dozor nad prováděním stavby svépomocí
- fyzická osoba oprávněná k odbornému vedení provádění stavby

? [A28] Stavebním dozorem se rozumí
+ odborný dozor nad prováděním nebo odstraňováním stavby, zařízení anebo terénní úpravy svépomocí
> § 14 písm. g) stavebního zákona
- odborný dozor vykonávaný výhradně autorizovanou osobou nad prováděním stavby
- dozor stavebního úřadu nad prováděním stavby svépomocí
- odborné vedení provádění stavby nebo její změny
- dozor projektanta nad souladem provádění stavby s dokumentací

? [A29] Musí stavební dozor vykonávat autorizovaná osoba?
+ Ne, postačí fyzická osoba, která má vysokoškolské vzdělání stavebního nebo architektonického směru nebo střední vzdělání stavebního směru s maturitní zkouškou a alespoň 3 roky praxe při provádění staveb
> § 14 písm. g) a § 165 odst. 1 stavebního zákona
- Ano, stavební dozor musí vždy vykonávat autorizovaná osoba s příslušnou autorizací podle autorizačního zákona bez ohledu na typ stavby
- Ne, postačí fyzická osoba se středním vzděláním stavebního směru s maturitní zkouškou, avšak bez jakékoli požadované délky praxe při provádění staveb
- Ano, ale jen u staveb pro bydlení, u ostatních staveb postačí osoba zcela bez odborného vzdělání a bez jakékoli praxe
- Ne, postačí jakákoli fyzická osoba bez odborného vzdělání, pokud má alespoň jeden rok praxe přímo na dané stavbě

? [A30] Může při provádění nástavby rodinného domu být zajištěn pouze stavební dozor?
+ Ne, u všech staveb pro bydlení včetně jejich změn musí být vždy zajištěn stavbyvedoucí.
> § 159 odst. 1 stavebního zákona
- Ano, pokud jde o nástavbu bez zásahu do nosných konstrukcí
- Ano, u nástaveb rodinných domů postačí stavební dozor
- Ne, stavbyvedoucí je nutný jen u staveb prováděných stavebním podnikatelem
- Ano, pokud si to stavebník sám zvolí v žádosti o povolení

? [A31] Stavbyvedoucím se rozumí
+ fyzická osoba oprávněná podle autorizačního zákona k odbornému vedení provádění nebo odstraňování stavby
> § 14 písm. f) stavebního zákona
- fyzická osoba, která zpracovává dokumentaci pro provádění stavby
- osoba oprávněná k odbornému dozoru nad prováděním stavby svépomocí
- fyzická osoba pověřená stavebníkem k vedení stavebního deníku
- fyzická osoba oprávněná podle autorizačního zákona k projektové činnosti

? [A32] Projektantem se rozumí
+ fyzická osoba oprávněná podle autorizačního zákona ke zpracování územně plánovací dokumentace, územní studie a projektové dokumentace
> § 14 písm. b) stavebního zákona
- fyzická osoba oprávněná podle autorizačního zákona k odbornému vedení provádění stavby
- fyzická osoba oprávněná ke zpracování pouze územně plánovací dokumentace
- osoba oprávněná ke zpracování dokumentace bez nutnosti autorizace
- fyzická osoba oprávněná k výkonu stavebního dozoru a autorskému dozoru

? [A33] Stavebním podnikatelem se rozumí
+ osoba oprávněná k provádění stavebních nebo montážních prací jako předmětu své činnosti podle živnostenského zákona
> § 14 písm. d) stavebního zákona
- osoba oprávněná k provádění zeměměřických činností ve výstavbě jako předmětu své podnikatelské činnosti
- fyzická osoba s autorizací k odbornému vedení provádění staveb podle autorizačního zákona a jeho prováděcích předpisů
- osoba, která zajišťuje stavební práce svépomocí pro sebe na základě živnostenského oprávnění
- osoba oprávněná k projektové činnosti podle autorizačního zákona vykonávaná jako hlavní předmět podnikání

? [A34] Dozorem projektanta se rozumí
+ průběžný odborný dozor nad souladem realizace dokumentace pro provádění záměru s dokumentací o povolení záměru a nad prováděním záměru v souladu s dokumentací pro provedení záměru
> § 14 písm. h) stavebního zákona
- průběžná kontrola stavebního úřadu nad souladem provádění záměru s vydaným povolením a s ověřenou dokumentací pro povolení stavby
- odborný dozor stavebního podnikatele nad kvalitou provedených prací a nad dodržováním technologických postupů při realizaci díla
- dozor nadřízeného stavebního úřadu nad postupem podřízeného stavebního úřadu při vydávání povolení záměru a jeho následné kontrole
- průběžné vedení stavebního deníku projektantem v průběhu výstavby a jeho pravidelné předávání stavebnímu úřadu ke kontrole

? [A35] Nejblíže nadřazenou územně plánovací dokumentací se pro regulační plán rozumí
+ územní plán
> § 12 písm. p) bod 1 stavebního zákona
- zásady územního rozvoje
- územní rozvojový plán
- územní studie
- územní opatření o stavební uzávěře

- jednal na pokyn nadřízeného, aniž by si byl vědom možného následku
- jednal v domnění, že jeho jednání je v souladu s předpisy, přestože si vzhledem ke své odbornosti a zastávané funkci mohl a měl být vědom rizika, které jeho jednání nebo opomenutí pro bezpečnost stavby představovalo, avšak tuto skutečnost nezjistil ani po řádném prověření

? [D42] Pokud při zřícení nosné konstrukce mostu přijde o život několik lidí, přičemž se zjistí, že příčinou pádu mostu byly vady projektové dokumentace, které by zhotovitel jako odborník měl odhalit (avšak neodhalil)
+ proti odpovědným osobám může být vedeno trestní stíhání pro spáchání trestného činu obecného ohrožení z nedbalosti nebo usmrcení z nedbalosti. Poškozené osoby (např. pozůstalí) mohou požadovat náhradu škody v rámci trestního nebo občanskoprávního řízení
> § 143 odst. 2 a 273 trestního zákoníku
- proti odpovědným osobám lze vést pouze občanskoprávní řízení, trestní stíhání nepřichází v úvahu bez prokázání úmyslu
- proti odpovědným osobám může být vedeno trestní stíhání jen pro trestný čin obecného ohrožení, usmrcení z nedbalosti se na projektovou vadu nevztahuje
- poškozené osoby mohou požadovat náhradu škody pouze v občanskoprávním řízení, v trestním řízení to zákon nepřipouští
- proti odpovědným osobám může být vedeno trestní stíhání pouze tehdy, jednaly-li úmyslně
- proti odpovědným osobám může být vedeno trestní stíhání pro trestný čin obecného ohrožení z nedbalosti, usmrcení z nedbalosti se posuzuje jen jako přitěžující okolnost

? [D43] Pokud kvůli vadné projektové dokumentace dojde ke zřícení mostu, přičemž přijde o život několik lidí,
+ trestní stíhání může být vedeno nejen vůči odpovědným osobám (např. projektant, zhotovitel, subdodavatel), ale také proti právnickým osobám (např. projekční kancelář, stavební společnost)
> § 1 a násl. zákona č. 418/2011 Sb., o trestní odpovědnosti právnických osob a řízení proti nim
- trestní stíhání může být vedeno pouze proti fyzickým osobám, právnické osoby trestně odpovědné nejsou
- trestní stíhání proti právnickým osobám lze vést jen tehdy, souhlasí-li s tím fyzická osoba, která čin spáchala
- trestní stíhání právnické osoby je možné pouze v případě úmyslných trestných činů
- trestní stíhání proti právnické osobě lze vést jen tehdy, zanikla-li odpovědnost fyzické osoby
- trestní stíhání proti právnickým osobám je možné jen tehdy, je-li právnická osoba organizační složkou státu
- trestní stíhání může být vedeno pouze proti té z odpovědných osob, která byla v době zřícení mostu ve funkci statutárního orgánu příslušné projekční nebo stavební společnosti

- ten, kdo uzavřel smlouvu se správcem povodí, a bez smlouvy každý, jde-li o vypouštění odpadních vod

? [G5] Vodní toky jsou
+ povrchové vody tekoucí v korytě vlastním spádem trvale nebo po převažující část roku, včetně vod v nich uměle vzdutých
> § 43 vodního zákona
- povrchové vody stojaté, shromážděné v přirozených nebo umělých prohlubeninách zemského povrchu
- podzemní vody tekoucí přirozeným prouděním v horninovém prostředí trvale nebo po převažující část roku
- povrchové vody tekoucí v korytě vlastním spádem pouze po dobu trvání povodně nebo přívalových srážek
- vodní díla sloužící k regulaci odtoku vody z povodí, včetně jejich příslušenství
- povrchové vody vzduté vodním dílem bez přirozeného koryta a přirozeného spádu

? [G6] Ochranná pásma vodních zdrojů využívaných nebo využitelných pro zásobování pitnou vodou stanoví vodoprávní úřady
+ na návrh nebo z vlastního podnětu opatřením obecné povahy
> § 30 vodního zákona
- vždy jen na návrh vlastníka vodního zdroje opatřením obecné povahy
- na návrh nebo z vlastního podnětu formou územního rozhodnutí
- výhradně na základě žádosti provozovatele vodovodu rozhodnutím ve správním řízení
- z vlastního podnětu po projednání s krajským úřadem obecně závaznou vyhláškou
- na návrh nebo z vlastního podnětu formou veřejnoprávní smlouvy s vlastníkem vodního zdroje

? [G7] Vodními díly jsou také
+ stavby sloužící k nakládání s vodami i v případě, že se v nich momentálně žádná voda nenachází
> § 55 vodního zákona
- stavby sloužící k nakládání s vodami pouze v případě, že jsou trvale zatopeny vodou
- pozemky určené územním plánem k budoucí výstavbě vodních děl, i když na nich stavba dosud nezačala
- zařízení pro jímání srážkových vod umístěná na střechách staveb, bez ohledu na jejich kapacitu
- vodovodní a kanalizační přípojky, pokud jsou napojeny na vodovod pro veřejnou potřebu
- pouze stavby vodovodů a kanalizací pro veřejnou potřebu bez ohledu na to, zda obsahují vodu

? [G8] Vodovodem pro veřejnou potřebu je také
+ vodovod, který má denní produkci vody vyšší než 10 m3 dodávané vody
> § 1 zákona o vodovodech a kanalizacích
- vodovod, který má denní produkci vody vyšší než 50 m3 dodávané vody
- vodovod, který slouží k rozvodu jiné než pitné vody, pokud jej užívá více odběratelů
- vodovod, který má denní produkci vody vyšší než 5 m3 dodávané vody
- vodovod, který je ve vlastnictví obce bez ohledu na denní produkci vody
- vodovod, který má denní produkci vody vyšší než 20 m3 dodávané vody

? [G9] Odpadem, na nějž se vztahuje zákon č. 541/2020 Sb., o odpadech, je
+ každá movitá věc, které se osoba zbavuje nebo je povinna se zbavit
> § 4 odst. 1 zákona o odpadech
- každá movitá i nemovitá věc, které se osoba zbavuje z důvodu jejího opotřebení
- každá věc, kterou vlastník prohlásí za nepotřebnou v evidenci odpadů
- pouze taková movitá věc, kterou její vlastník úmyslně a prokazatelně zničil
- každá movitá věc, kterou osoba již využila k původnímu účelu a nabízí ji k dalšímu prodeji
- každá movitá věc, u níž vlastník oznámí krajskému úřadu záměr se jí zbavit

? [G10] Původcem odpadu je také
+ obec od okamžiku, kdy osoba odloží odpad na místo k tomu určené
> § 5 odst. 1 písm. c) zákona č. 541/2020 Sb.
- kraj od okamžiku, kdy osoba odloží odpad na místo k tomu určené
- obec od okamžiku, kdy je odpad svezen svozovou společností na skládku
- stát od okamžiku, kdy je odpad zařazen do katalogu odpadů
- obec až od okamžiku, kdy odpad předá oprávněné osobě k dalšímu využití
- provozovatel sběrného dvora od okamžiku, kdy odpad převezme od původce

? [G11] Pro účely zákona č. 541/2020 Sb., o odpadech, se skládkou rozumí
+ zařízení pro odstranění odpadů pomocí řízeného povrchového nebo podpovrchového ukládání
> § 11 odst. 2 písm. g) zákona č. 541/2020 Sb.
- zařízení pro dočasné soustřeďování odpadů před jejich předáním k dalšímu využití
- zařízení pro odstranění odpadů pomocí jejich spalování za řízených podmínek
- zařízení pro trvalé skladování nebezpečných odpadů v podzemních prostorách bez možnosti jejich úniku
- místo, kam obec ukládá vytříděný komunální odpad před jeho svozem k recyklaci
- zařízení pro úpravu odpadů mechanickým tříděním před jejich uložením na skládku

? [G12] Kdo rozhoduje v pochybnostech o tom, zda je určitá věc odpadem?
+ krajský úřad
> § 4 odst. 4 zákona č. 541/2020 Sb.
- obecní úřad obce s rozšířenou působností
- Ministerstvo životního prostředí
- Česká inspekce životního prostředí
- místně příslušný stavební úřad
- Státní fond životního prostředí

? [G13] Co je to katalog odpadu?
+ seznam druhů odpadu stanovený vyhláškou
> § 6 odst. 2 zákona č. 541/2020 Sb.
- seznam provozovatelů zařízení k nakládání s odpady vedený krajským úřadem
- evidence množství odpadů vznikajících u jednotlivých původců vedená obcí
- seznam druhů odpadu stanovený nařízením vlády
- přehled skládek a spaloven odpadů zveřejňovaný Ministerstvem životního prostředí
- seznam látek a předmětů, které nejsou považovány za odpad, stanovený zákonem

? [G14] Co je to plán odpadového hospodářství?
+ koncepční materiál státu a krajů za účelem vytváření podmínek pro předcházení vzniku odpadů a nakládání s nimi
> § 97 odst. 2 zákona č. 541/2020 Sb.
- koncepční materiál obcí za účelem vytváření podmínek pro svoz a třídění komunálního odpadu
- závazný právní předpis státu stanovící povinnosti původců odpadů při nakládání s nimi
- koncepční materiál státu a krajů za účelem vytváření podmínek pro omezení dovozu odpadů ze zahraničí
- evidence zařízení k nakládání s odpady vedená Ministerstvem životního prostředí
- koncepční materiál kraje vydávaný jednou za deset let formou obecně závazné vyhlášky

? [G15] Kalem podle zákona č. 541/2020 Sb., o odpadech, je také
+ kal ze septiků sloužících čištění odpadních vod z domácností
> § 67 odst. 1 písm. a) zákona č. 541/2020 Sb.
- kal z čistíren odpadních vod sloužících čištění průmyslových odpadních vod
- kal vznikající při těžbě a praní kameniva v pískovnách a štěrkovnách
- kal ze septiků sloužících čištění srážkových vod z veřejných komunikací
- kal vznikající při úpravě povrchové vody na vodu pitnou
- kal z lapáků tuku umístěných v provozovnách veřejného stravování

? [G16] Co je podle zákona č. 541/2020 Sb., o odpadech, komunitní kompostování?
+ soustřeďování rostlinných zbytků z údržby zeleně, zahrad a domácností v obci a jejich zpracování na kompost
> § 65 odst. 1 zákona č. 541/2020 Sb.
- soustřeďování veškerého biologicky rozložitelného odpadu z domácností a jeho energetické využití
- zpracování průmyslového bioodpadu na kompost zajišťované obcí ve spolupráci s podnikateli
- soustřeďování rostlinných zbytků z údržby zeleně a zahrad mimo obec a jejich odvoz na skládku
- individuální kompostování rostlinných zbytků na zahradě jednotlivého vlastníka nemovitosti
- soustřeďování stavebního a demoličního odpadu z obce a jeho zpracování na druhotnou surovinu

? [G17] Malým zařízením pro úpravu a využití biologicky rozložitelného odpadu je
+ zařízení, kde se pro jednu zakládku nepoužije více než 20 t, celkově ročně více než 150 t
> § 11 odst. 2 písm. e) zákona č. 541/2020 Sb.
- zařízení, kde se pro jednu zakládku nepoužije více než 21 t, celkově ročně více než 151 t
- zařízení, kde se pro jednu zakládku nepoužije více než 19 t, celkově ročně více než 149 t
- zařízení, kde se pro jednu zakládku nepoužije více než 20 t, celkově ročně více než 149 t
- zařízení, kde se pro jednu zakládku nepoužije více než 19 t, celkově ročně více než 150 t
- zařízení, kde se pro jednu zakládku nepoužije více než 21 t, celkově ročně více než 150 t

? [G18] Povinností obcí ke komunálnímu odpadu je
+ převzít veškerý komunální odpad vznikající na jejím území při činnosti nepodnikajících fyzických osob
> § 59 odst. 1 zákona č. 541/2020 Sb.
- převzít veškerý odpad vznikající na jejím území při činnosti podnikajících fyzických osob
- zajistit energetické využití veškerého komunálního odpadu vznikajícího na jejím území
- převzít pouze tříděný komunální odpad vznikající na jejím území při činnosti nepodnikajících fyzických osob
- zajistit odstranění veškerého nebezpečného odpadu vznikajícího na jejím území při činnosti nepodnikajících fyzických osob
- převzít veškerý komunální odpad vznikající na území sousedních obcí na základě vzájemné dohody

? [G19] Předmětem posuzování vlivů na životní prostředí jsou
+ některé zákonem vymezené záměry staveb, činností a technologií a koncepce zadané nebo schvalované orgány veřejné správy
> § 3 písm. a) a b) zákona o posuzovaní vlivů na životní prostředí
- veškeré záměry staveb, činností a technologií bez ohledu na jejich rozsah a umístění
- pouze koncepce zadané nebo schvalované orgány veřejné správy, nikoliv jednotlivé záměry staveb
- některé zákonem vymezené záměry staveb financované výhradně z veřejných rozpočtů
- záměry staveb, činností a technologií podléhající stavebnímu povolení podle stavebního zákona
- pouze záměry staveb umístěných ve zvláště chráněných územích přírody

? [G20] Kdo zpracovává posudek k záměru z hlediska jeho vlivu na životní prostředí?
+ na základě smlouvy uzavřené s příslušným orgánem ochrany životního prostředí osoba k tomu oprávněná
> § 9 zákona o posuzování vlivů na životní prostředí
- na základě smlouvy uzavřené s oznamovatelem záměru osoba k tomu oprávněná
- z moci úřední příslušný orgán ochrany životního prostředí bez součinnosti třetí osoby
- na základě jmenování krajským úřadem odborně způsobilá osoba zapsaná v seznamu autorizovaných osob
- na základě smlouvy uzavřené s příslušným stavebním úřadem osoba k tomu oprávněná
- bezplatně a bez smlouvy pracovník Ministerstva životního prostředí

? [G21] Závazné stanovisko orgánu ochrany životního prostředí k posouzení vlivu záměru na životní prostředí, představuje pro navazující řízení
+ závazný podklad pro vydání rozhodnutí podle zvláštních právních předpisů
> § 9a zákona o posuzování vlivů na životní prostředí
- pouze doporučující podklad pro vydání rozhodnutí podle zvláštních právních předpisů
- podklad závazný pouze pro orgán, který jej vydal, nikoliv pro navazující správní řízení
- nezávazné vyjádření, které navazující orgán může, ale nemusí zohlednit
- závazný podklad pro vydání rozhodnutí pouze v případě staveb dopravní infrastruktury
- konečné rozhodnutí ve věci, které nahrazuje navazující správní řízení

? [G22] Které správní úřady jsou příslušné k posuzování vlivů na životní prostředí?
+ Ministerstvo životního prostředí a krajské úřady, které při posuzování stavebních záměrů z hlediska vlivu na životní prostředí postupují v součinnosti s příslušným stavebním úřadem
> § 21 a § 22 zákona o posuzování vlivů na životní prostředí
- Ministerstvo životního prostředí a obecní úřady obcí s rozšířenou působností, které postupují v součinnosti s příslušným stavebním úřadem
- pouze Ministerstvo životního prostředí, které postupuje v součinnosti s Českou inspekcí životního prostředí
- krajské úřady a Česká inspekce životního prostředí, které postupují v součinnosti s příslušným vodoprávním úřadem
- Ministerstvo životního prostředí a Agentura ochrany přírody a krajiny České republiky, které postupují v součinnosti s příslušným stavebním úřadem
- Ministerstvo pro místní rozvoj a krajské úřady, které postupují v součinnosti s příslušným stavebním úřadem

? [G23] Cílem ochrany přírody a krajiny je zejména
+ udržení a obnova přírodní rovnováhy v krajině, ochrana rozmanitostí forem života, přírodních hodnot a krás a šetrné hospodaření s přírodními zdroji
> § 1 zákona o ochraně přírody a krajiny
- maximalizace hospodářského využití přírodních zdrojů při zachování minimálního rozsahu chráněných území
- udržení a obnova přírodní rovnováhy v krajině výhradně na území zvláště chráněných území přírody
- podpora zemědělské a lesnické výroby při současném omezení výstavby ve volné krajině
- vytváření podmínek pro rekreační využívání krajiny širokou veřejností za všech okolností
- udržení stávajícího stavu krajiny bez ohledu na jeho přírodní hodnotu a rozmanitost forem života

? [G24] Významné krajinné prvky
+ podléhají registraci, kterou provádí orgán ochrany přírody
> § 6 zákona o ochraně přírody a krajiny
- podléhají evidenci, kterou provádí katastrální úřad
- podléhají schválení, které provádí krajský úřad formou opatření obecné povahy
- podléhají registraci, kterou provádí obec v samostatné působnosti obecně závaznou vyhláškou
- podléhají souhlasu, který uděluje Ministerstvo životního prostředí
- podléhají registraci, kterou provádí Agentura ochrany přírody a krajiny České republiky pouze u prvků na území národních parků

? [G25] Národní parky se člení podle režimu ochrany
+ na čtyři zóny
> § 18 zákona o ochraně přírody a krajiny
- na tři zóny
- na dvě zóny
- na pět zón
- na zóny podle druhu ekosystému bez pevně stanoveného počtu
- na tři zóny s možností zřízení klidového území mimo tyto zóny

? [G26] Jako chráněné krajinné oblasti se vyhlašují zejména
+ rozsáhlá území s harmonicky utvářenou krajinou
> § 25 zákona o ochraně přírody a krajiny
- rozsáhlá území s dosud nedotčeným přírodním prostředím bez lidské činnosti
- menší území soustředěného výskytu ohrožených druhů rostlin a živočichů
- rozsáhlá území sloužící především rekreačnímu využití obyvatelstva
- rozsáhlá území s výskytem cenných geologických útvarů vyhlašovaná vyhláškou Ministerstva životního prostředí
- území se zachovalými přírodními ekosystémy odpovídajícími celostátně nebo mezinárodně významným standardům

? [G27] Ptačí oblasti jsou
+ území stanovená nařízením vlády jako nejvhodnější pro ochranu z hlediska výskytu, stavu a početnosti populací některých ptáků
> § 45e zákona o ochraně přírody a krajiny
- území stanovená vyhláškou Ministerstva životního prostředí jako nejvhodnější pro ochranu vzácných rostlinných druhů
- území stanovená opatřením obecné povahy krajského úřadu jako nejvhodnější pro ochranu tažných druhů ptáků
- území stanovená nařízením vlády jako nejvhodnější pro ochranu evropsky významných typů přírodních stanovišť
- lokality zapsané do mezinárodního seznamu mokřadů významných pro vodní ptactvo
- území stanovená zákonem jako nejvhodnější pro ochranu z hlediska výskytu, stavu a početnosti populací všech druhů volně žijících živočichů

? [G28] Zdrojem emisí znečišťujících látek do ovzduší jsou
+ stacionární zdroje včetně spalovacích stacionárních zdrojů a mobilní zdroje
> § 2 písm. b), f) a g) zákona o ochraně ovzduší
- pouze stacionární zdroje včetně spalovacích stacionárních zdrojů, mobilní zdroje se nezapočítávají
- mobilní zdroje včetně drážních vozidel a stacionární zdroje s výjimkou spalovacích stacionárních zdrojů
- výhradně průmyslové provozy podléhající integrovanému povolení podle zákona o integrované prevenci
- stacionární zdroje evidované v registru znečišťování životního prostředí a zemědělské zdroje
- stacionární i mobilní zdroje, avšak pouze pokud překračují stanovené emisní limity

? [G29] Přípustná míra znečištění ovzduší je určena
+ emisními limity, emisními stropy, technickými podmínkami provozu a přípustnou tmavostí kouře
> § 4 odst. 1 zákona o ochraně ovzduší
- imisními limity, emisními stropy, technickými podmínkami provozu a přípustnou tmavostí kouře
- emisními limity, emisními stropy a technickými podmínkami provozu stanovenými výhradně krajskou vyhláškou
- emisními limity a přípustnou tmavostí kouře, technické podmínky provozu se nezohledňují
- emisními limity, emisními stropy, technickými podmínkami provozu a nejvyššími přípustnými koncentracemi ve vnějším ovzduší
- pouze emisními limity stanovenými pro jednotlivé kategorie stacionárních zdrojů

? [G30] Emisní limity musí být dodrženy
+ na každém komínovém průduchu nebo výdechu do ovzduší
> § 4 odst. 2 zákona o ochraně ovzduší
- v průměru za celý stacionární zdroj bez ohledu na počet komínových průduchů
- pouze na hlavním komínovém průduchu zdroje s nejvyšším výkonem
- na hranici pozemku provozovatele stacionárního zdroje
- na každém komínovém průduchu nebo výdechu do ovzduší s výjimkou zdrojů uvedených do provozu před rokem 2000
- v místě imisního monitoringu nejblíže k obytné zástavbě

? [G31] Úroveň znečišťování ovzduší se zjišťuje
+ jednorázovým nebo kontinuálním měřením emisí
> § 6 odst. 4 zákona o ochraně ovzduší
- výhradně kontinuálním měřením emisí u všech kategorií stacionárních zdrojů
- výpočtem na základě spotřeby paliva bez nutnosti přímého měření
- jednorázovým nebo kontinuálním měřením imisí v okolí stacionárního zdroje
- odborným odhadem provozovatele stacionárního zdroje na základě technické dokumentace

> §2 odst. 2, písm. a) bod 6 zákona č. 458/2000 Sb.
- místo, které je připojeno k přepravní nebo k distribuční soustavě a kde je instalováno odběrné plynové zařízení jednoho zákazníka, v němž dochází ke spotřebě plynu
- místo, které je připojeno k distribuční soustavě a kde je instalováno odběrné elektrické zařízení fyzické osoby nesplňující znaky podnikatele, v němž dochází ke spotřebě elektřiny
- místo, které je připojeno k přenosové nebo k distribuční soustavě a kde je instalováno měřicí zařízení k evidenci dodávky elektřiny jednomu zákazníkovi
- místo, které je připojeno k jakékoli veřejné síti technické infrastruktury a slouží k odběru energie jedním zákazníkem
- místo, které je připojeno k přenosové nebo k distribuční soustavě a kde je instalováno společné odběrné elektrické zařízení více zákazníků, v němž dochází ke spotřebě elektřiny

? [O5] K čemu je určena elektrická přípojka?
+ k připojení odběrného elektrického zařízení
> §2 odst. 2, písm. a) bod 2 zákona č. 458/2000 Sb.
- k připojení výrobny elektřiny k distribuční soustavě
- k propojení dvou částí distribuční soustavy v místě odběru
- k měření spotřeby elektřiny odběrného místa
- k ochraně odběrného elektrického zařízení před přepětím
- k odvodu elektřiny z odběrného místa zpět do sítě

? [O7] Jaký je účel ochranného pásma elektrizační soustavy?
+ zajištění spolehlivého provozu zařízení elektrizační soustavy a k ochraně života, zdraví a majetku osob
> §46 odst. 1 zákona č. 458/2000 Sb.
- zajištění bezpečného provozu zařízení plynárenské soustavy a k ochraně života, zdraví a majetku osob
- zajištění spolehlivého provozu zařízení pro výrobu či rozvod tepelné energie a k ochraně majetku osob
- ochrana života, zdraví a majetku osob v blízkosti vedení vysokého napětí
- zajištění spolehlivého provozu zařízení elektrizační soustavy a k ochraně životního prostředí a majetku osob
- zajištění bezpečného provozu zařízení elektrizační soustavy a k ochraně majetku jeho vlastníka

? [O8] Co označujeme pojmem přeložka zařízení (přenosové nebo distribuční soustavy) v elektroenergetice?
+ dílčí změna trasy vedení nebo přemístění některých prvků tohoto zařízení
> §47 odst. 1 zákona č. 458/2000 Sb.
- úplná výstavba nového vedení nahrazujícího zařízení v jiné trase
- výměna prvků zařízení za nové v jeho stávající trase
- trvalé odstavení zařízení z provozu za účelem jeho rekonstrukce
- umístění nového zařízení do trasy zrušeného vedení
- zvýšení přenosové kapacity zařízení při zachování jeho stávající trasy

? [O9] Jaký stav se rozumí pod označením "souběh" jednotlivých zařízení?
+ když jedno zařízení zasahuje svým ochranným pásmem do ochranného (popř. bezpečnostního) pásma druhého zařízení
> §48 odst. 1 zákona č. 458/2000 Sb.
- když trasa jednoho zařízení protíná trasu druhého zařízení v jednom nebo více bodech
- když dvě zařízení stejného druhu vedou ve společné trase v minimální vzájemné vzdálenosti
- když se dvě zařízení fyzicky dotýkají nebo jsou uložena ve společném výkopu bez odstupu
- když jedno zařízení zasahuje svým bezpečnostním pásmem do bezpečnostního pásma druhého zařízení
- když je jedno zařízení umístěno uvnitř ochranného pásma stavby, nikoli jiného technického zařízení

? [O10] Co je plynárenská soustava?
+ vzájemně propojený soubor zařízení pro výrobu, přepravu, distribuci a uskladnění plynu
> §2 odst. 2, písm. b) bod 7 zákona č. 458/2000 Sb.
- vzájemně propojený soubor zařízení pro výrobu, přenos, transformaci a distribuci plynu
- vzájemně propojený soubor zařízení pro výrobu, přepravu a distribuci plynu
- vzájemně propojený zdroj nebo zdroje plynu a rozvodné plynové zařízení sloužící k dodávkám plynu pro vytápění
- vzájemně propojený soubor plynovodů určených výhradně pro přepravu zemního plynu mezi jednotlivými kraji České republiky
- vzájemně propojený soubor zařízení pro přepravu, distribuci a uskladnění plynu

? [O11] Co je přepravní soustava?
+ vzájemně propojený soubor vysokotlakých plynovodů a kompresních stanic a souvisejících technologických objektů, propojený s plynárenskými soustavami v zahraničí
> §2 odst. 2, písm. b) bod 14 zákona č. 458/2000 Sb.
- vzájemně propojený soubor středotlakých a nízkotlakých plynovodů a předávacích stanic, propojený s plynárenskými soustavami sousedních krajů
- vzájemně propojený soubor vysokotlakých plynovodů a kompresních stanic určených výhradně pro tuzemskou přepravu plynu
- vzájemně propojený soubor vysokotlakých plynovodů a předávacích stanic a souvisejících technologických objektů, propojený s plynárenskými soustavami v zahraničí
- vzájemně propojený soubor vysokotlakých, středotlakých a nízkotlakých plynovodů a kompresních stanic propojený s plynárenskými soustavami v zahraničí
- vzájemně propojený soubor vysokotlakých plynovodů a kompresních stanic propojený přímo s odběrnými místy jednotlivých zákazníků

? [O12] Co je distribuční soustava v plynárenství?
+ vzájemně propojený soubor vysokotlakých, středotlakých a nízkotlakých plynovodů, plynovodních přípojek a těžebních plynovodů, který není přímo propojen s kompresními stanicemi
> §2 odst. 2, písm. b) bod 1 zákona č. 458/2000 Sb.
- vzájemně propojený soubor vysokotlakých, středotlakých a nízkotlakých plynovodů, plynovodních přípojek a těžebních plynovodů, který je přímo propojen s kompresními stanicemi
- vzájemně propojený soubor vysokotlakých plynovodů a kompresních stanic, který je přímo propojen s plynárenskými soustavami v zahraničí
- vzájemně propojený soubor vysokotlakých, středotlakých a nízkotlakých plynovodů a plynovodních přípojek, který není přímo propojen s kompresními stanicemi
- vzájemně propojený soubor vysokotlakých, středotlakých a nízkotlakých plynovodů, plynovodních přípojek a těžebních plynovodů, který není přímo propojen s předávacími stanicemi
- vzájemně propojený soubor vysokotlakých, středotlakých a nízkotlakých plynovodů, plynovodních přípojek a odběrných plynových zařízení, který není přímo propojen s kompresními stanicemi

? [O13] Co je odběrné místo v plynárenství?
+ místo, kde je instalováno odběrné plynové zařízení jednoho zákazníka, do něhož se uskutečňuje dodávka plynu měřená měřicím zařízením
> §2 odst. 2, písm. b) bod 4 zákona č. 458/2000 Sb.
- místo, které je připojeno k přepravní soustavě a kde je instalováno odběrné plynové zařízení jednoho zákazníka, v němž dochází ke spotřebě plynu
- místo, kde je instalováno společné odběrné plynové zařízení více zákazníků, do něhož se uskutečňuje dodávka plynu měřená měřicím zařízením
- místo, kde je instalováno odběrné plynové zařízení jednoho zákazníka, do něhož se uskutečňuje dodávka plynu bez ohledu na jeho množství
- místo, kde je plynovodní přípojka připojena k odběrnému plynovému zařízení bez ohledu na to, zda dochází k odběru plynu
- místo, kde je instalováno odběrné plynové zařízení jednoho zákazníka - fyzické osoby, do něhož se uskutečňuje dodávka plynu měřená měřicím zařízením

? [O14] Co je odběrné plynové zařízení?
+ veškerá zařízení počínaje hlavním uzávěrem plynu včetně zařízení pro konečné využití plynu; není jím měřicí zařízení
> §2 odst. 2, písm. b) bod 5 zákona č. 458/2000 Sb.
- veškerá zařízení počínaje hlavním uzávěrem plynu včetně zařízení pro konečné využití plynu; je jím i měřicí zařízení
- veškerá zařízení před hlavním uzávěrem plynu včetně plynovodní přípojky; není jím zařízení pro konečné využití plynu
- veškerá zařízení počínaje hlavním uzávěrem plynu včetně zařízení pro konečné využití plynu; není jím regulátor tlaku plynu
- pouze spotřebiče plynu instalované za hlavním uzávěrem plynu u jednoho zákazníka; není jím měřicí zařízení
- veškerá zařízení počínaje plynovodní přípojkou včetně zařízení pro konečné využití plynu; není jím měřicí zařízení

? [O16] Co je plynovodní přípojka?
+ plynovodní zařízení, začínající odbočením z plynovodu distribuční soustavy a ukončené před hlavním uzávěrem plynu
> §2 odst. 2, písm. b) bod 11 zákona č. 458/2000 Sb.
- plynovodní zařízení, začínající odbočením z plynovodu distribuční soustavy a ukončené za hlavním uzávěrem plynu
- plynovodní zařízení, začínající odbočením z plynovodu přepravní soustavy a ukončené před hlavním uzávěrem plynu
- plynovodní zařízení, začínající odbočením z plynovodu distribuční soustavy a zahrnující i odběrné plynové zařízení zákazníka
- plynovodní zařízení, začínající odbočením z těžebního plynovodu a ukončené před hlavním uzávěrem plynu
- nízkotlaké plynovodní zařízení, začínající odbočením z plynovodu distribuční soustavy a ukončené před hlavním uzávěrem plynu

? [O17] Jaký je účel ochranného pásma plynárenských zařízení?
+ zajištění bezpečného a spolehlivého provozu plynárenských zařízení
> §68 odst. 1 zákona č. 458/2000 Sb.
- zajištění bezpečného provozu plynárenských zařízení a ochrana života a zdraví osob v jejich okolí
- zajištění bezpečného provozu zařízení elektrizační soustavy
- zajištění bezpečného provozu vysokotlakých plynovodů
- zamezení nebo zmírnění účinků případných havárií plynových zařízení
- zajištění bezpečného a spolehlivého provozu odběrných plynových zařízení

? [O18] Jaký je účel bezpečnostního pásma plynových zařízení?
+ zamezení nebo zmírnění účinků případných havárií plynových zařízení a k ochraně života, zdraví, bezpečnosti a majetku osob
> §69 odst. 1 zákona č. 458/2000 Sb.
- zajištění bezpečného a spolehlivého provozu plynárenských zařízení a ochrana majetku osob v jejich okolí
- zamezení nebo zmírnění účinků případných havárií plynových zařízení a k ochraně majetku osob
- zamezení nebo zmírnění účinků případných poruch zařízení elektrizační soustavy a k ochraně života, zdraví a majetku osob
- zamezení poškození plynových zařízení při stavební činnosti v jejich blízkosti
- prevence úniku plynu do ovzduší a snížení dopadu na životní prostředí v okolí zařízení

? [O19] Čím je tvořena soustava zásobování tepelnou energií?
+ vzájemně propojeným zdrojem nebo zdroji tepelné energie a rozvodným tepelným zařízením sloužící pro dodávky tepelné energie pro vytápění, chlazení, ohřev teplé vody a technologické procesy
> §2 odst. 2, písm. c) bod 14 zákona č. 458/2000 Sb.
- vzájemně propojeným zdrojem nebo zdroji tepelné energie a rozvodným tepelným zařízením sloužící pro dodávky tepelné energie pouze pro vytápění a ohřev teplé vody
- vzájemně propojeným souborem zařízení pro výrobu, přenos, transformaci a distribuci tepelné energie na území České republiky
- jediným zdrojem tepelné energie a rozvodným tepelným zařízením sloužícím výhradně pro vytápění a ohřev teplé vody v bytových domech
- vzájemně propojeným zdrojem nebo zdroji tepelné energie a odběrným tepelným zařízením sloužící pro dodávky tepelné energie pro vytápění a ohřev teplé vody
- vzájemně propojeným zdrojem nebo zdroji tepelné energie ve vlastnictví obce a rozvodným tepelným zařízením sloužící pro dodávky tepla obyvatelům obce

? [O21] Co je odběrné místo?
+ místo, v němž přechází tepelná energie z vlastnictví dodavatele tepelné energie do vlastnictví odběratele tepelné energie
> §2 odst. 2, písm. c) bod 7 zákona č. 458/2000 Sb.
- místo, v němž přechází tepelná energie z vlastnictví odběratele tepelné energie do vlastnictví dodavatele tepelné energie
- místo, které je připojeno k rozvodnému tepelnému zařízení a kde je instalováno tepelné zařízení jednoho zákazníka, v němž dochází ke spotřebě tepelné energie
- místo v bytovém domě, v němž přechází tepelná energie z vlastnictví dodavatele do vlastnictví společenství vlastníků jednotek
- místo, v němž přechází odpovědnost za tepelnou energii z dodavatele tepelné energie na odběratele tepelné energie
- místo, kde je instalováno měřicí zařízení evidující množství tepelné energie dodané do bytového domu

? [O23] Co je tepelná přípojka?
+ část tepelné sítě, která umožňuje dodávku tepelné energie pouze pro jeden objekt
> §2 odst. 2, písm. c) bod 15 zákona č. 458/2000 Sb.
- část tepelné sítě, která umožňuje dodávku tepelné energie pro více objektů současně
- samostatné rozvodné tepelné zařízení, které je v provozu nezávisle na soustavě zásobování tepelnou energií
- zařízení začínající odbočením z rozvodného tepelného zařízení a ukončené před předávací stanicí tepla
- část tepelné sítě, která umožňuje dodávku tepelné energie pouze pro jeden byt v bytovém domě
- část tepelné sítě, která umožňuje odvod přebytečné tepelné energie z jednoho objektu zpět do zdroje

? [O24] Jaký je účel ochranného pásma zařízení na výrobu či rozvod tepelné energie?
+ zajištění spolehlivého provozu zařízení pro výrobu či rozvod tepelné energie a ochraně života, zdraví, bezpečnosti a majetku osob
> §87 odst. 1 zákona č. 458/2000 Sb.
- zajištění bezpečného provozu plynárenských zařízení a ochraně života a zdraví osob v jejich okolí
- zajištění spolehlivého provozu zařízení pro výrobu tepelné energie a ochraně zdraví osob
- zajištění spolehlivého provozu zařízení pro výrobu či rozvod tepelné energie a ochraně životního prostředí v jeho okolí
- zajištění spolehlivého provozu odběrných tepelných zařízení a ochraně života, zdraví, bezpečnosti a majetku osob
- zajištění bezpečného provozu vedení elektrizační soustavy v jeho bezprostřední blízkosti

? [O27] Co se rozumí pod pojmem kritická infrastruktura?
+ prvek, popř. systém prvků, jehož narušení funkce by mělo závažný dopad na bezpečnost státu, zabezpečení základních životních potřeb obyvatelstva, zdraví osob nebo ekonomiku státu
> § 2 písm. g) zákona č. 240/2000 Sb.
- zejména stavba, zařízení, prostředek nebo veřejná infrastruktura určené podle průřezových a odvětvových kritérií, bez ohledu na závažnost případného narušení jejich funkce
- kritická infrastruktura na území České republiky, jejíž narušení by mělo závažný dopad i na jiný členský stát Evropské unie
- opatření zaměřená na snížení rizika narušení funkce prvku kritické infrastruktury nebo systému prvků kritické infrastruktury
- provozovatel prvku kritické infrastruktury, jehož činnost podléhá zvláštnímu režimu ochrany podle zákona o krizovém řízení
- prvek nebo systém prvků výhradně ve vlastnictví nebo správě státu, jehož narušení by mohlo ohrozit obranyschopnost České republiky

- provozování jednotného informačního místa, vedení evidence stavebníků sítí a přidělování rádiových kmitočtů
- zřizování neveřejných komunikačních sítí, poskytování hlasových služeb v mobilní síti a testování nových technologií

<canvas id="konfety" aria-hidden="true"></canvas>

<script>
(function () {
  "use strict";

  var MAX_RYSEK = 30;
  var MAX_HISTORIE = 60;    // kolik zodpovězených otázek jde v sezení dolistovat zpět

  // plánovač: intervaly Leitnerových úrovní ve dnech (úroveň 0 až 5)
  var INTERVALY = [0.35, 1, 3, 7, 14, 21];
  var NOVYCH_NA_ZACATKU = 8;   // kolik nových otázek otevře frontu
  var NA_JEDNU_NOVOU = 4;      // po kolika opakovaných se vsune další nová
  var RELAPS_ODSTUP = 18;      // o kolik otázek dál se vrátí chybná otázka
  var DEN = 86400000;

  var vsechny = [];         // všechny načtené otázky
  var nazvy = {};           // písmeno okruhu -> název
  var vybrane = {};         // písmeno okruhu -> true/false
  var aktivni = [];         // otázky vybraných okruhů

  var statistika = {};
  var fronta = [];          // naplánované pořadí otázek pro toto sezení
  var sezeni = {};          // klíče otázek, které v tomto sezení už padly
  var relaps = {};          // klíče otázek už jednou vrácených po chybě
  var kolo = 1;
  var ohlasitKolo = false;
  var prubeh = [];
  var spravne = 0, celkem = 0;
  var aktualni = null, predchozi = null;

  // historie zkoušecího sezení: každý záznam je jedna zobrazená otázka
  // { o: otázka, moznosti: [], spravnaPoz: index, vybrano: index nebo null }
  // Poslední záznam je ten živý, starší jsou jen k prohlížení.
  var historie = [], pozice = -1;

  var rezim = "zkouseni";          // "zkouseni" | "uceni"
  var poradiNahodne = false;
  var ucSeznam = [], ucPozice = 0;

  var ULOZISTE = "zkousec-mik-v1";
  var ulozeniFunguje = true;

  var el = {};
  ["rysky","skore","idcko","otazka","odpovedi","sporne","napoveda","souhrn",
   "seznamOkruhu","vstup","hlaska","panelOkruhy","panelOtazky",
   "panelStat","statSouhrn","statSeznam","statHlaska","statPozn",
   "odkazPredpis","patickaZk","patickaUc","prepinacPoradi","popisUceni",
   "hlaskaKolo"].forEach(function (id) {
    el[id] = document.getElementById(id);
  });
  el.app = document.getElementById("app");
  el.dalsi = document.getElementById("btnDalsi");
  el.zpetZk = document.getElementById("btnZpetZk");

  // ---------------------------------------------------------- úložiště

  function nactiUlozene() {
    try {
      var raw = localStorage.getItem(ULOZISTE);
      if (!raw) return {};
      var d = JSON.parse(raw);
      return (d && d.statistika) || {};
    } catch (e) { ulozeniFunguje = false; return {}; }
  }

  function ulozUlozene() {
    try {
      localStorage.setItem(ULOZISTE, JSON.stringify({
        verze: 2, ulozeno: Date.now(), statistika: statistika
      }));
      ulozeniFunguje = true;
    } catch (e) { ulozeniFunguje = false; }
  }

  // ---------------------------------------------------------- načtení

  var reId = /^\[([A-Za-z]+\d+)\]\s*(.*)$/;

  function rozeber(text) {
    var otazky = [], jmena = {}, akt = null;
    var radky = String(text).split(/\r?\n/);

    for (var i = 0; i < radky.length; i++) {
      var radek = radky[i].trim();
      if (!radek || radek.charAt(0) === "#") continue;

      var znacka = radek.charAt(0);
      var obsah = radek.slice(1).trim();

      if (znacka === "@") {
        var d = obsah.indexOf("=");
        if (d > 0) jmena[obsah.slice(0, d).trim().toUpperCase()] = obsah.slice(d + 1).trim();
      } else if (znacka === "?") {
        var id = null, sekce = "—", m = reId.exec(obsah);
        if (m) {
          id = m[1].toUpperCase();
          sekce = id.replace(/\d+$/, "");
          obsah = m[2];
        }
        akt = { id: id, sekce: sekce, otazka: obsah, spravna: null,
                odkaz: "", spatne: [] };
        otazky.push(akt);
      } else if (znacka === "+" && akt) {
        if (akt.spravna === null) akt.spravna = obsah;
      } else if (znacka === ">" && akt) {
        akt.odkaz = akt.odkaz ? akt.odkaz + " " + obsah : obsah;
      } else if (znacka === "-" && akt) {
        var sporny = obsah.charAt(0) === "!";
        akt.spatne.push({ text: sporny ? obsah.slice(1).trim() : obsah, sporny: sporny });
      }
    }

    return {
      otazky: otazky.filter(function (o) {
        return o.otazka && o.spravna && o.spatne.length >= 1;
      }),
      nazvy: jmena
    };
  }

  function slozText(sada) {
    var out = [];
    Object.keys(nazvy).sort().forEach(function (k) {
      out.push("@ " + k + " = " + nazvy[k]);
    });
    if (out.length) out.push("");
    sada.forEach(function (o) {
      out.push("? " + (o.id ? "[" + o.id + "] " : "") + o.otazka);
      out.push("+ " + o.spravna);
      if (o.odkaz) out.push("> " + o.odkaz);
      o.spatne.forEach(function (s) { out.push((s.sporny ? "-! " : "- ") + s.text); });
      out.push("");
    });
    return out.join("\n").trim();
  }

  // ---------------------------------------------------------- okruhy

  function okruhy() {
    var poradi = [], pocty = {};
    vsechny.forEach(function (o) {
      if (!(o.sekce in pocty)) { pocty[o.sekce] = 0; poradi.push(o.sekce); }
      pocty[o.sekce]++;
    });
    poradi.sort();
    return poradi.map(function (s) { return { sekce: s, pocet: pocty[s] }; });
  }

  function prepocitejAktivni() {
    aktivni = vsechny.filter(function (o) { return vybrane[o.sekce]; });
    predchozi = null;
    sestavFrontu();
    if (rezim === "uceni") sestavUcSeznam(aktualni);
    var vsechnyOkruhy = okruhy();
    var kolik = vsechnyOkruhy.filter(function (k) { return vybrane[k.sekce]; }).length;
    document.getElementById("btnNabidka")
      .classList.toggle("filtr", kolik < vsechnyOkruhy.length);
  }

  function vykresliOkruhy() {
    var sez = okruhy();
    var zv = prehled().mapa;
    el.seznamOkruhu.textContent = "";
    vykresliOdpocet();

    sez.forEach(function (k) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "okruh";
      b.setAttribute("aria-pressed", vybrane[k.sekce] ? "true" : "false");

      var z = document.createElement("span");
      z.className = "znacka";
      z.textContent = "\u2713";

      var j = document.createElement("span");
      j.className = "jmeno";
      j.textContent = "Okruh " + k.sekce;
      if (nazvy[k.sekce]) {
        var s = document.createElement("small");
        s.textContent = nazvy[k.sekce];
        j.appendChild(s);
      }
      var kz = zv[k.sekce];
      if (kz) {
        var mini = document.createElement("span");
        mini.className = "mini";
        var vypl = document.createElement("i");
        vypl.style.width = (100 * kz.nad3 / kz.celkem).toFixed(1) + "%";
        vypl.style.background = barvaZvladnuti(kz) || "var(--linka)";
        mini.appendChild(vypl);
        j.appendChild(mini);
        b.title = kz.nad3 + " z " + kz.celkem + " otázek na úrovni 3 a výš";
      }

      var p = document.createElement("span");
      p.className = "pocet";
      p.textContent = k.pocet;

      b.appendChild(z); b.appendChild(j); b.appendChild(p);
      b.addEventListener("click", function () {
        vybrane[k.sekce] = !vybrane[k.sekce];
        b.setAttribute("aria-pressed", vybrane[k.sekce] ? "true" : "false");
        prepocitejAktivni();
        vykresliSouhrn();
      });
      el.seznamOkruhu.appendChild(b);
    });

    vykresliSouhrn();
  }

  function vykresliSouhrn() {
    var sez = okruhy();
    var vyb = sez.filter(function (k) { return vybrane[k.sekce]; });
    var otazek = vyb.reduce(function (a, k) { return a + k.pocet; }, 0);
    var nove = vsechny.filter(function (o) {
      return vybrane[o.sekce] && !videna(o);
    }).length;
    el.souhrn.textContent = "Vybráno " + vyb.length + " z " + sez.length
      + " okruhů, " + otazek + " otázek"
      + (nove ? ", z toho " + nove + " dosud nezkoušených." : ".");
  }

  // ---------------------------------------------------------- výběr otázky

  function klic(o) { return o.id || o.otazka; }

  // statZaznam se jmenuje takhle, aby se nepletl se zaznam() z historie sezení
  function statZaznam(o) {
    var k = klic(o), s = statistika[k];
    if (!s) s = statistika[k] = { ano: 0, ne: 0, kdy: 0, uroven: 0 };
    if (typeof s.uroven !== "number") {        // starší zálohy úroveň neznají
      s.uroven = Math.max(0, Math.min(INTERVALY.length - 1, (s.ano || 0) - (s.ne || 0)));
    }
    return s;
  }

  function videna(o) {
    var s = statistika[klic(o)];
    return !!(s && (s.ano || s.ne));
  }

  // poměr uplynulého času k intervalu úrovně; 1 a víc znamená splatnou otázku
  function urgence(o) {
    var s = statZaznam(o);
    var iv = INTERVALY[Math.min(s.uroven, INTERVALY.length - 1)] * DEN;
    return (Date.now() - (s.kdy || 0)) / iv;
  }

  function sestavFrontu() {
    var nove = [], drive = [];
    aktivni.forEach(function (o) {
      if (sezeni[klic(o)]) return;             // v tomto sezení už padla
      (videna(o) ? drive : nove).push(o);
    });

    zamichej(nove);
    drive = drive
      .map(function (o) {                      // drobný rozhoz, ať pořadí není mechanické
        return { o: o, u: urgence(o) * (0.9 + 0.2 * Math.random()) };
      })
      .sort(function (a, b) { return b.u - a.u; })
      .map(function (x) { return x.o; });

    fronta = nove.splice(0, NOVYCH_NA_ZACATKU);
    while (drive.length || nove.length) {
      for (var i = 0; i < NA_JEDNU_NOVOU && drive.length; i++) fronta.push(drive.shift());
      if (nove.length) fronta.push(nove.shift());
      if (!drive.length) { fronta = fronta.concat(nove); nove.length = 0; }
    }
  }

  function vyberOtazku() {
    if (!fronta.length) sestavFrontu();
    if (!fronta.length && aktivni.length) {    // celý fond projitý, začíná další kolo
      sezeni = {}; relaps = {}; kolo++; ohlasitKolo = true;
      sestavFrontu();
    }
    return fronta.shift() || null;
  }

  function zamichej(pole) {
    for (var i = pole.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pole[i]; pole[i] = pole[j]; pole[j] = t;
    }
    return pole;
  }

  function sestavMoznosti(o) {
    var spatne = zamichej(o.spatne.slice()).slice(0, 2);
    var vse = spatne.concat([{ text: o.spravna, sporny: false, spravna: true }]);
    return zamichej(vse);
  }

  // ---------------------------------------------------------- učící mód

  function cisloId(id) {
    var m = /(\d+)$/.exec(id || "");
    return m ? parseInt(m[1], 10) : 0;
  }

  function sestavUcSeznam(ponechat) {
    ucSeznam = aktivni.slice();
    if (poradiNahodne) {
      zamichej(ucSeznam);
    } else {
      ucSeznam.sort(function (a, b) {
        if (a.sekce !== b.sekce) return a.sekce < b.sekce ? -1 : 1;
        return cisloId(a.id) - cisloId(b.id);
      });
    }
    var i = ponechat ? ucSeznam.indexOf(ponechat) : -1;
    ucPozice = i >= 0 ? i : 0;
  }

  function vykresliUceni() {
    if (!ucSeznam.length) {
      prazdno(vsechny.length
        ? "Není vybraný žádný okruh. Vyber ho tlačítkem \u2261 vpravo nahoře."
        : "Zatím tu nejsou žádné otázky. Vlož je tlačítkem \u2261 vpravo nahoře.");
      return;
    }
    if (ucPozice < 0) ucPozice = ucSeznam.length - 1;
    if (ucPozice >= ucSeznam.length) ucPozice = 0;

    var o = ucSeznam[ucPozice];
    aktualni = o;

    el.idcko.textContent = o.id || "";
    el.otazka.textContent = o.otazka;
    el.skore.innerHTML = "<b>" + (ucPozice + 1) + "</b> / " + ucSeznam.length;
    el.rysky.textContent = "";

    el.odpovedi.textContent = "";
    var b = document.createElement("div");
    b.className = "odpoved uceni";
    var p = document.createElement("span");
    p.className = "pismeno";
    p.textContent = "\u2713";
    var t = document.createElement("span");
    t.className = "text";
    t.textContent = o.spravna;
    b.appendChild(p); b.appendChild(t);
    el.odpovedi.appendChild(b);

    el.odkazPredpis.textContent = o.odkaz || "";
    el.odkazPredpis.classList.toggle("skryte", !o.odkaz);
    el.sporne.classList.add("skryte");
    window.scrollTo(0, 0);
  }

  function posunUceni(o) {
    ucPozice += o;
    vykresliUceni();
  }

  function nastavRezim(novy) {
    rezim = novy;
    var uceni = rezim === "uceni";
    el.patickaZk.classList.toggle("skryte", uceni);
    el.patickaUc.classList.toggle("skryte", !uceni);
    el.prepinacPoradi.classList.toggle("skryte", !uceni);
    el.popisUceni.classList.toggle("skryte", !uceni);
    el.app.classList.remove("zodpovezeno");
    if (uceni) {
      sestavUcSeznam(null);        // vstup do učení začíná od první otázky
      vykresliUceni();
    } else {
      predchozi = null;
      vykresliRysky();
      dalsiOtazka();
    }
  }

  function oznacPrepinac(prvek, atribut, hodnota) {
    Array.prototype.forEach.call(prvek.children, function (b) {
      b.classList.toggle("akt", b.getAttribute(atribut) === hodnota);
    });
  }

  // ---------------------------------------------------------- vykreslení

  function vykresliRysky() {
    if (rezim === "uceni") return;
    var vzorek = prubeh.slice(-MAX_RYSEK);
    el.rysky.textContent = "";
    for (var i = 0; i < vzorek.length; i++) {
      var d = document.createElement("div");
      d.className = "ryska " + (vzorek[i] ? "ano" : "ne");
      el.rysky.appendChild(d);
    }
    el.skore.innerHTML = "<b>" + spravne + "</b> / " + celkem
      + "<span class=\"zbyva\"> \u00b7 v kole " + fronta.length + "</span>";
  }

  function prazdno(zprava) {
    el.idcko.textContent = "";
    el.otazka.textContent = zprava;
    el.odpovedi.textContent = "";
    el.sporne.classList.add("skryte");
    el.odkazPredpis.classList.add("skryte");
    el.dalsi.classList.add("skryte");
    el.zpetZk.classList.add("skryte");
    el.napoveda.classList.remove("skryte");
    el.napoveda.textContent = "";
    aktualni = null;
  }

  function zaznam() { return pozice >= 0 ? historie[pozice] : null; }

  function naKonci() { return pozice >= historie.length - 1; }

  function dalsiOtazka() {
    if (!vsechny.length) { prazdno("Zatím tu nejsou žádné otázky. Vlož je tlačítkem ≡ vpravo nahoře."); return; }
    if (!aktivni.length) { prazdno("Není vybraný žádný okruh. Vyber ho tlačítkem ≡ vpravo nahoře."); return; }

    var o = vyberOtazku();
    if (!o) { prazdno("Není vybraný žádný okruh. Vyber ho tlačítkem \u2261 vpravo nahoře."); return; }
    predchozi = o;
    var kO = klic(o);

    var m = sestavMoznosti(o);
    historie.push({
      o: o,
      moznosti: m,
      spravnaPoz: m.findIndex(function (x) { return x.spravna; }),
      vybrano: null,
      znamka: !videna(o) ? "nová"
              : (relaps[kO] && sezeni[kO] ? "znovu" : ""),
      kolo: ohlasitKolo
        ? "Prošel jsi všechny vybrané otázky. Začíná " + kolo
          + ". kolo, pořadí se přepočítalo podle toho, co ti dělá potíže."
        : ""
    });
    ohlasitKolo = false;
    while (historie.length > MAX_HISTORIE) historie.shift();

    pozice = historie.length - 1;
    vykresliRysky();
    vykresliZaznam();
  }

  function vykresliZaznam() {
    var z = zaznam();
    if (!z) return;

    aktualni = z.o;
    var hotovo = z.vybrano !== null;
    var zive = naKonci();

    el.app.classList.toggle("zodpovezeno", hotovo);

    el.hlaskaKolo.textContent = z.kolo || "";
    el.hlaskaKolo.classList.toggle("skryte", !z.kolo);

    el.idcko.textContent = z.o.id || "";
    if (z.znamka) {
      var zn = document.createElement("span");
      zn.className = "znamka";
      zn.textContent = z.znamka;
      el.idcko.appendChild(zn);
    }
    if (!zive) {
      var znacka = document.createElement("span");
      znacka.className = "prohlizeni";
      znacka.textContent = (z.o.id ? "  ·  " : "")
        + "prohlížení " + (pozice + 1) + " z " + historie.length;
      el.idcko.appendChild(znacka);
    }

    el.otazka.textContent = z.o.otazka;
    el.odpovedi.textContent = "";

    z.moznosti.forEach(function (m, i) {
      var b = document.createElement("button");
      b.className = "odpoved";
      b.type = "button";

      if (hotovo) {
        if (i === z.vybrano) {
          b.classList.add(z.vybrano === z.spravnaPoz ? "vybrana-ano" : "vybrana-ne");
        } else if (i === z.spravnaPoz) {
          b.classList.add("ukazana");
        }
      }

      var p = document.createElement("span");
      p.className = "pismeno";
      p.textContent = "abc".charAt(i);

      var t = document.createElement("span");
      t.className = "text";
      t.textContent = m.text;

      b.appendChild(p); b.appendChild(t);
      b.addEventListener("click", function () { odpovez(i); });
      el.odpovedi.appendChild(b);
    });

    var sporna = [];
    if (hotovo) {
      z.moznosti.forEach(function (m, i) {
        if (m.sporny) sporna.push("abc".charAt(i));
      });
    }
    if (sporna.length) {
      el.sporne.textContent = "Možnost " + sporna.join(" a ")
        + " jsem si nebyl jistý — ověř si ji v předpisu, než se ji naučíš jako špatnou.";
    }
    el.sporne.classList.toggle("skryte", !sporna.length);

    el.odkazPredpis.textContent = hotovo ? (z.o.odkaz || "") : "";
    el.odkazPredpis.classList.toggle("skryte", !(hotovo && z.o.odkaz));

    vykresliPatickuZk();
    window.scrollTo(0, 0);
  }

  function vykresliPatickuZk() {
    var z = zaznam();
    var hotovo = z && z.vybrano !== null;

    el.zpetZk.classList.remove("skryte");
    el.zpetZk.disabled = pozice <= 0;

    if (!naKonci()) {
      el.dalsi.textContent = "Vpřed";
      el.dalsi.classList.remove("skryte");
      el.napoveda.classList.add("skryte");
    } else if (hotovo) {
      el.dalsi.textContent = "Další otázka";
      el.dalsi.classList.remove("skryte");
      el.napoveda.classList.add("skryte");
    } else {
      el.dalsi.classList.add("skryte");
      el.napoveda.classList.remove("skryte");
      el.napoveda.textContent = "Vyber jednu z možností";
    }
  }

  function vpred() {
    if (!naKonci()) { pozice++; vykresliZaznam(); return; }
    var z = zaznam();
    if (z && z.vybrano !== null) dalsiOtazka();
  }

  function zpetVHistorii() {
    if (pozice > 0) { pozice--; vykresliZaznam(); }
  }

  function odpovez(index) {
    var z = zaznam();
    if (!z || !naKonci() || z.vybrano !== null) return;   // zpětně se neodpovídá
    z.vybrano = index;
    el.app.classList.add("zodpovezeno");

    var trefa = index === z.spravnaPoz;
    celkem++;
    if (trefa) spravne++;
    prubeh.push(trefa);

    var k = klic(z.o);
    var s = statZaznam(z.o);
    var urovenPred = s.uroven;
    if (trefa) {
      s.ano++;
      s.uroven = Math.min(INTERVALY.length - 1, s.uroven + 1);
    } else {
      s.ne++;
      s.uroven = 0;
    }
    s.kdy = Date.now();
    sezeni[k] = true;
    ulozUlozene();

    // chybnou otázku vrátím ještě v tomto sezení, ale jen jednou a s odstupem
    if (!trefa && !relaps[k]) {
      relaps[k] = true;
      var kam = Math.min(fronta.length,
        RELAPS_ODSTUP - 2 + Math.floor(Math.random() * 5));
      fronta.splice(kam, 0, z.o);
    }

    var tlacitka = el.odpovedi.children;
    tlacitka[index].classList.add(trefa ? "vybrana-ano" : "vybrana-ne");
    if (!trefa) tlacitka[z.spravnaPoz].classList.add("ukazana");

    var sporna = [];
    z.moznosti.forEach(function (m, i) {
      if (m.sporny) sporna.push("abc".charAt(i));
    });
    if (sporna.length) {
      el.sporne.textContent = "Možnost " + sporna.join(" a ")
        + " jsem si nebyl jistý — ověř si ji v předpisu, než se ji naučíš jako špatnou.";
      el.sporne.classList.remove("skryte");
    }

    if (z.o.odkaz) {
      el.odkazPredpis.textContent = z.o.odkaz;
      el.odkazPredpis.classList.remove("skryte");
    }

    vykresliRysky();
    vykresliPatickuZk();
    el.dalsi.focus({ preventScroll: true });

    hraPoOdpovedi({
      trefa: trefa, urovenPred: urovenPred, urovenPo: s.uroven, neCelkem: s.ne,
      znovu: z.znamka === "znovu", tlacitko: tlacitka[index]
    });
  }

  // ---------------------------------------------------------- statistiky

  function radek(jmeno, podtitulek, cislo, slabe) {
    var d = document.createElement("div");
    d.className = "radek" + (slabe ? " slabe" : "");
    var k = document.createElement("span");
    k.className = "kdo";
    k.textContent = jmeno;
    if (podtitulek) {
      var m = document.createElement("small");
      m.textContent = podtitulek;
      k.appendChild(m);
    }
    var c = document.createElement("span");
    c.className = "cislo";
    c.innerHTML = cislo;
    d.appendChild(k); d.appendChild(c);
    return d;
  }

  function vykresliStatistiky() {
    vykresliHru();
    el.statSeznam.textContent = "";
    el.statHlaska.textContent = "";

    el.statPozn.classList.toggle("skryte", ulozeniFunguje);
    if (!ulozeniFunguje) {
      el.statPozn.textContent = "Prohlížeč tady neumožnil trvalé uložení, "
        + "statistika platí jen do zavření stránky. Ulož si zálohu do souboru.";
    }

    // souhrn počítám jen z otázek, které jsou právě načtené
    var celkemAno = 0, celkemNe = 0, dotcenych = 0;
    vsechny.forEach(function (o) {
      var st = statistika[klic(o)];
      if (st && (st.ano || st.ne)) {
        celkemAno += st.ano; celkemNe += st.ne; dotcenych++;
      }
    });
    var vsehoOdpovedi = celkemAno + celkemNe;

    var zname = {};
    vsechny.forEach(function (o) { zname[klic(o)] = true; });
    var cizich = Object.keys(statistika).filter(function (k) {
      return !zname[k] && (statistika[k].ano || statistika[k].ne);
    }).length;

    el.statSouhrn.textContent = vsehoOdpovedi
      ? vsehoOdpovedi + " odpovědí, úspěšnost "
        + Math.round(100 * celkemAno / vsehoOdpovedi) + " %. Projito "
        + dotcenych + " ze " + vsechny.length + " načtených otázek."
        + (cizich ? " Dalších " + cizich + " otázek mám uložených z jiné sady." : "")
      : (cizich
          ? "K načteným otázkám zatím nemám žádnou odpověď. Z jiné sady mám uloženo "
            + cizich + " otázek."
          : "Zatím žádná zodpovězená otázka.");

    if (!vsehoOdpovedi) return;

    // po okruzích
    var poOkruzich = {};
    vsechny.forEach(function (o) {
      var b = poOkruzich[o.sekce] || (poOkruzich[o.sekce] =
        { ano: 0, ne: 0, dotcenych: 0, celkem: 0, slabych: 0 });
      b.celkem++;
      var st = statistika[klic(o)];
      if (st && (st.ano || st.ne)) {
        b.dotcenych++; b.ano += st.ano; b.ne += st.ne;
        if (st.ne > st.ano) b.slabych++;
      }
    });

    Object.keys(poOkruzich).sort().forEach(function (sek) {
      var b = poOkruzich[sek];
      if (!b.ano && !b.ne) return;
      var pct = Math.round(100 * b.ano / (b.ano + b.ne));
      el.statSeznam.appendChild(radek(
        "Okruh " + sek,
        (nazvy[sek] || "") + " · projito " + b.dotcenych + " z " + b.celkem
          + (b.slabych ? ", k doučení " + b.slabych : ""),
        "<b>" + pct + " %</b>",
        pct < 70
      ));
    });

    // nejhorší otázky
    var nejhorsi = vsechny
      .map(function (o) { return { o: o, st: statistika[klic(o)] }; })
      .filter(function (x) { return x.st && x.st.ne > 0; })
      .sort(function (a, b) {
        return (b.st.ne - b.st.ano) - (a.st.ne - a.st.ano) || b.st.ne - a.st.ne;
      })
      .slice(0, 10);

    if (nejhorsi.length) {
      var nadpis = document.createElement("div");
      nadpis.className = "radek";
      nadpis.innerHTML = "<span class=\"kdo\"><b>Nejčastěji chybované</b></span>";
      el.statSeznam.appendChild(nadpis);

      nejhorsi.forEach(function (x) {
        var t = x.o.otazka;
        el.statSeznam.appendChild(radek(
          x.o.id || "—",
          t.length > 70 ? t.slice(0, 67) + "…" : t,
          "<b>" + x.st.ne + "</b>&thinsp;/&thinsp;" + (x.st.ano + x.st.ne),
          true
        ));
      });
    }
  }

  function exportujStatistiku() {
    try {
      var blob = new Blob(
        [JSON.stringify({ verze: 2, ulozeno: Date.now(), statistika: statistika, hra: hra }, null, 1)],
        { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "zkousec-statistika.json";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
      el.statHlaska.textContent = "";
    } catch (e) {
      el.statHlaska.textContent = "Zálohu se nepodařilo vytvořit.";
    }
  }

  function nactiZalohu(soubor) {
    var r = new FileReader();
    r.onload = function () {
      try {
        var d = JSON.parse(r.result);
        var st = d && d.statistika;
        if (!st || typeof st !== "object") throw new Error("bez statistiky");
        var pridano = 0;
        Object.keys(st).forEach(function (k) {
          var c = statistika[k] || (statistika[k] = { ano: 0, ne: 0, kdy: 0, uroven: 0 });
          var novejsi = (st[k].kdy || 0) > (c.kdy || 0);
          c.ano += st[k].ano || 0;
          c.ne  += st[k].ne  || 0;
          if (novejsi && typeof st[k].uroven === "number") c.uroven = st[k].uroven;
          else if (typeof c.uroven !== "number") c.uroven = 0;
          c.kdy = Math.max(c.kdy || 0, st[k].kdy || 0);
          pridano++;
        });
        ulozUlozene();
        // hra: starší zálohy ji neobsahují, pak se body dopočtou ze statistik
        if (d.hra && typeof d.hra === "object") sloucHru(d.hra);
        else hra.xp = Math.max(hra.xp, semeno());
        zkontrolujOdznaky(kontext(), true);
        ulozHru();
        vykresliListu();
        vykresliStatistiky();
        el.statHlaska.textContent = "Přičteno " + pridano + " záznamů"
          + (d.hra ? ", sloučeny body a odznaky." : ".");
      } catch (e) {
        el.statHlaska.textContent = "Soubor se nepodařilo přečíst.";
      }
    };
    r.onerror = function () { el.statHlaska.textContent = "Soubor se nepodařilo přečíst."; };
    r.readAsText(soubor);
  }

  // ---------------------------------------------------------- panely

  function zobraz(panel) {
    el.panelOkruhy.classList.toggle("skryte", panel !== "okruhy");
    el.panelOtazky.classList.toggle("skryte", panel !== "otazky");
    el.panelStat.classList.toggle("skryte", panel !== "statistiky");
  }

  function panelOtevreny() {
    return !el.panelOkruhy.classList.contains("skryte")
        || !el.panelOtazky.classList.contains("skryte")
        || !el.panelStat.classList.contains("skryte");
  }

  function zavri() {
    zobraz(null);
    if (rezim === "uceni") {
      vykresliUceni();
    } else if (!aktualni || aktivni.indexOf(aktualni) < 0) {
      dalsiOtazka();
    }
  }

  function nastavOtazky(vysledek) {
    vsechny = vysledek.otazky;
    nazvy = vysledek.nazvy;
    vybrane = {};
    okruhy().forEach(function (k) { vybrane[k.sekce] = true; });
    prepocitejAktivni();
    vykresliOkruhy();
  }

  function nactiZPanelu() {
    var v = rozeber(el.vstup.value);
    if (!v.otazky.length) {
      el.hlaska.textContent = "Nenašel jsem žádnou použitelnou otázku. "
        + "Každá potřebuje řádek ?, řádek + a aspoň jeden řádek -.";
      return;
    }
    nastavOtazky(v);
    prubeh = []; spravne = celkem = 0;
    historie = []; pozice = -1;
    sezeni = {}; relaps = {}; kolo = 1; sestavFrontu();
    zobraz(null);
    vykresliRysky();
    if (rezim === "uceni") { sestavUcSeznam(null); vykresliUceni(); }
    else dalsiOtazka();
  }
